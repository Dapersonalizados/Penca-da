const API_BRIDGE_URL = "https://penca-da.vercel.app/api/resultados";

async function sincronizarResultadosAuto(){
  try{
    const r = await fetch(API_BRIDGE_URL);
    if(!r.ok) return null;
    const data = await r.json();
    return data.resultados || [];
  }catch(e){
    console.error("Error sincronizando resultados", e);
    return null;
  }
}

// Busca el partido en GRUPOS que coincide con un resultado de la API
function encontrarPartidoId(local, visitante){
  const lEs = traducirEquipo(local);
  const vEs = traducirEquipo(visitante);
  // Buscar en grupos
  for(const g of GRUPOS){
    for(const p of g.partidos){
      if((p.local===lEs && p.visitante===vEs) || (p.local===vEs && p.visitante===lEs)){
        return {id:p.id, invertido: p.local===vEs};
      }
    }
  }
  // Buscar en fases eliminatorias (16avos tienen equipos fijos)
  for(const fase of FASES_ELIMINATORIAS){
    for(const p of fase.partidos){
      if(!p.local || !p.visitante) continue;
      if((p.local===lEs && p.visitante===vEs) || (p.local===vEs && p.visitante===lEs)){
        return {id:p.id, invertido: p.local===vEs};
      }
    }
  }
  return null;
}

const ADMIN_PASS = "da2026";

function calcPuntos(pred, real) {
  if (!real || real.local==="" || real.visitante==="") return null;
  const rl=parseInt(real.local), rv=parseInt(real.visitante);
  const pl=parseInt(pred.local), pv=parseInt(pred.visitante);
  if (isNaN(pl)||isNaN(pv)) return null;
  if (pl===rl && pv===rv) return 3;
  if ((pl>pv&&rl>rv)||(pl<pv&&rl<rv)||(pl===pv&&rl===rv)) return 1;
  return 0;
}

function calcTotal(usuario, resultados, campeonReal) {
  const preds = load(`da_pred_${usuario}`, {});
  let total=0, exactos=0, resultadosOk=0;
  Object.entries(preds).forEach(([id, pred]) => {
    const real = resultados[id];
    const pts = calcPuntos(pred, real);
    if (pts===3){total+=3;exactos++;}
    else if (pts===1){total+=1;resultadosOk++;}
  });
  // Bonus campeón: 5 pts si acertó
  const predCampeon = load(`da_campeon_${usuario}`, "");
  if (campeonReal && predCampeon && predCampeon===campeonReal) total+=5;
  return { total, exactos, resultadosOk };
}

// ── FIREBASE CONFIG ───────────────────────────────────────────────────────────
const FB_URL = "https://penca-da-default-rtdb.firebaseio.com";

async function fbSet(path, data) {
  try {
    await fetch(`${FB_URL}/${path}.json`, {
      method: "PUT",
      body: JSON.stringify(data),
      headers: {"Content-Type": "application/json"}
    });
  } catch(e) { console.error("fbSet error", e); }
}

async function fbGet(path) {
  try {
    const r = await fetch(`${FB_URL}/${path}.json`);
    return await r.json();
  } catch(e) { return null; }
}

async function fbUpdate(path, data) {
  try {
    await fetch(`${FB_URL}/${path}.json`, {
      method: "PATCH",
      body: JSON.stringify(data),
      headers: {"Content-Type": "application/json"}
    });
  } catch(e) { console.error("fbUpdate error", e); }
}

async function fbDelete(path) {
  try {
    await fetch(`${FB_URL}/${path}.json`, { method: "DELETE" });
  } catch(e) { console.error("fbDelete error", e); }
}

// localStorage fallback
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}

      if(u) setUsuarios(Object.values(u));
      setLoadingUsuarios(false);
    })();
  },[]);

  const entrar=async(u)=>{
    // Si toca un perfil existente, entra directo sin crear duplicado
    if(u){ onLogin(u.nombre, u.empresa); return; }
    const n=nombre.trim(), e=empresa.trim();

    if(!e){setErr("Ingresá tu empresa"); return;}
    const key=(n+"__"+e).replace(/[.#$\[\]/]/g,"_");
    // Verificar en Firebase si ya existe
    const existeEnFb = await fbGet(`usuarios/${key}`);
    if(existeEnFb){
      // Ya existe, entra directo sin duplicar
      onLogin(n,e);
      return;
    }
    // Es nuevo, lo registra

        marginBottom:32,textTransform:"uppercase"}}>
        ⚽ Acertá y ganá

        borderRadius:20,padding:"28px 32px",width:"100%",maxWidth:360}}>
        <p style={{color:"rgba(255,255,255,0.45)",textAlign:"center",
          marginBottom:18,fontSize:13}}>
          Completá tus datos para participar

        {/* Nombre */}

          textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>
          Nombre
        </label>
        <input value={nombre} onChange={e=>{setNombre(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&entrar()}
          placeholder="Tu nombre completo..."
          style={{width:"100%",boxSizing:"border-box",
            background:"rgba(255,255,255,0.07)",border:`2px solid ${DA_BORDER}`,
            borderRadius:10,color:"#fff",fontSize:16,padding:"11px 13px",
            outline:"none",marginBottom:14}}/>

        {/* Empresa */}
        <label style={{color:DA_TEXT_LIGHT,fontSize:12,fontWeight:600,
          textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>
          Empresa
        </label>
        <input value={empresa} onChange={e=>{setEmpresa(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&entrar()}
          placeholder="Tu empresa..."
          style={{width:"100%",boxSizing:"border-box",
            background:"rgba(255,255,255,0.07)",border:`2px solid ${DA_BORDER}`,
            borderRadius:10,color:"#fff",fontSize:16,padding:"11px 13px",
            outline:"none",marginBottom:14}}/>

        {/* WhatsApp */}

          textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:5}}>
          WhatsApp <span style={{color:"rgba(255,255,255,0.3)",fontWeight:400,textTransform:"none"}}>(opcional)</span>

          <span style={{background:"rgba(255,255,255,0.07)",border:`2px solid ${DA_BORDER}`,

        {(loadingUsuarios||usuarios.length>0)&&(

// ── PREDICCIONES ───────────────────────────────────────────────────────────────
function Predicciones({usuario,empresa,resultados,campeonReal,onSave}){
  const key=`da_pred_${usuario}`;
  const [preds,setPreds]=useState(()=>load(key,{}));
  const [campeon,setCampeon]=useState(()=>load(`da_campeon_${usuario}`,""));
  const [saved,setSaved]=useState(false);

  const set=(id,side,val)=>setPreds(p=>({...p,[id]:{...p[id],[side]:val}}));

  const guardar=async()=>{
    save(key,preds);
    save(`da_campeon_${usuario}`,campeon);
    const fbKey=(usuario+"__"+empresa).replace(/[.#$\[\]/]/g,"_");
    await fbUpdate(`predicciones/${fbKey}`, preds);
    await fbSet(`campeones/${fbKey}`, campeon);
    onSave();
    setSaved(true); setTimeout(()=>setSaved(false),2500);
  };

  // WhatsApp: compartir puntaje propio
  const compartirPuntaje=()=>{
    const {total,exactos,resultadosOk}=calcTotal(usuario,resultados,campeonReal);
    const cBono=campeon&&campeonReal&&campeon===campeonReal?" + acerté el campeón 🏆":"";
    const msg=`⚽ *Penca Mundial Da!*\n\n`+
      `👤 ${usuario} (${empresa})\n`+
      `🏆 Mi campeón: ${campeon||"sin elegir"}\n`+
      `📊 Puntaje: *${total} pts*${cBono}\n`+
      `✓ Exactos: ${exactos} | ~ Resultados: ${resultadosOk}\n\n`+

    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,"_blank");

// ── TABLA ──────────────────────────────────────────────────────────────────────
function Tabla({resultados,campeonReal}){
  const [usuarios,setUsuarios]=useState([]);
  const [fbPreds,setFbPreds]=useState({});
  const [fbCampeones,setFbCampeones]=useState({});
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    (async()=>{
      setLoading(true);
      const u=await fbGet("usuarios");
      const p=await fbGet("predicciones");

      const c=await fbGet("campeones");
      if(u) setUsuarios(Object.values(u));
      if(p) setFbPreds(p);

      if(c) setFbCampeones(c);
      setLoading(false);
    })();
  },[]);

  const medals=["🥇","🥈","🥉"];

  const recomendarTabla=()=>{
    const msg=`⚽ ¡Te invito a la *Penca Mundial Da!* 🏆\n\n`+
      `Acertá los resultados del Mundial, elegí al campeón y competí por premios increíbles:\n\n`+
      `🥇 1er premio: $5.000 para gastar como quieras\n`+
      `🥈 2do premio: $2.500 para gastar como quieras\n`+
      `🥉 3er premio: Canguro con diseño a elección\n`+
      `4️⃣ 4to premio: Gorro bordado con diseño a elección\n\n`+
      `Podés conocer el universo Da! en www.dapersonalizados.com.uy\n\n`+
      `¡Entrá, jugá y ganá! 👇\nhttps://penca-da.vercel.app`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,"_blank");
  };

  const rows=usuarios.map(u=>{
    const fbKey=u.nombre.replace(/[.#$\[\]/]/g,"_")+"__"+u.empresa.replace(/[.#$\[\]/]/g,"_");
    const preds=fbPreds[fbKey]||{};
    let total=0,exactos=0,resultadosOk=0;
    Object.entries(preds).forEach(([id,pred])=>{
      const real=resultados[id];
      const pts=calcPuntos(pred,real);
      if(pts===3){total+=3;exactos++;}
      else if(pts===1){total+=1;resultadosOk++;}
    });
    const predCampeon=fbCampeones[fbKey]||"";
    if(campeonReal&&predCampeon===campeonReal) total+=5;
    const acertoCampeon=campeonReal&&predCampeon===campeonReal;
    return{...u,total,exactos,resultadosOk,predCampeon,acertoCampeon};
  }).sort((a,b)=>b.total-a.total);

  return(
    <div style={{maxWidth:640,margin:"0 auto",padding:"0 16px 24px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
        marginBottom:22,gap:8,flexWrap:"wrap"}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
          fontSize:24,color:DA_YELLOW,letterSpacing:3,textTransform:"uppercase"}}>
          Tabla de posiciones
        </div>
        <button onClick={recomendarTabla}
          style={{background:"#128C7E",color:"#fff",border:"none",
            borderRadius:20,padding:"8px 16px",fontSize:13,fontWeight:700,
            cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",
            whiteSpace:"nowrap"}}>
          📨 Invitar
        </button>
      </div>

      {campeonReal&&(
        <div style={{background:`${DA_YELLOW}12`,border:`1px solid ${DA_YELLOW}33`,
          borderRadius:12,padding:"10px 16px",marginBottom:16,
          color:DA_YELLOW,fontSize:14,fontWeight:600}}>
          🏆 Campeón: {FLAGS[campeonReal]||""} {campeonReal} (+5 pts quienes lo eligieron)
        </div>
      )}

      {loading&&(
        <p style={{color:"rgba(255,255,255,0.4)",textAlign:"center",padding:24}}>
          Cargando participantes...
        </p>
      )}

      {!loading&&rows.length===0&&(
        <p style={{color:"rgba(255,255,255,0.35)",textAlign:"center"}}>
          Todavía no hay participantes.
        </p>
      )}

      {rows.map((r,i)=>(
        <div key={r.key} style={{
          display:"flex",alignItems:"center",gap:12,
          background:i===0?`${DA_YELLOW}15`:DA_CARD,
          border:i===0?`1px solid ${DA_YELLOW}44`:`1px solid rgba(255,255,255,0.06)`,
          borderRadius:14,padding:"13px 16px",marginBottom:9}}>
          <div style={{width:32,textAlign:"center",
            fontSize:i<3?20:15,fontWeight:700,
            fontFamily:"'Barlow Condensed',sans-serif",
            color:i===0?DA_YELLOW:"rgba(255,255,255,0.35)"}}>
            {i<3?medals[i]:i+1}
          </div>
          <div style={{flex:1}}>
            <div style={{color:"#fff",fontWeight:700,fontSize:15}}>{r.nombre}</div>
            <div style={{color:DA_TEXT_LIGHT,fontSize:11,marginTop:1}}>{r.empresa}</div>
            <div style={{color:"rgba(255,255,255,0.3)",fontSize:11,marginTop:2}}>
              ✓ {r.exactos} exactos · ~ {r.resultadosOk} resultados
              {r.acertoCampeon&&<span style={{color:"#00C896"}}> · 🏆 +5 campeón</span>}
            </div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:28,
              color:i===0?DA_YELLOW:"#fff",fontWeight:700,lineHeight:1}}>
              {r.total}
            </div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)"}}>pts</div>
          </div>
        </div>
      ))}

      <div style={{background:DA_CARD,borderRadius:12,padding:"11px 16px",
        marginTop:14,display:"flex",gap:16,justifyContent:"center",
        color:"rgba(255,255,255,0.4)",fontSize:12,flexWrap:"wrap"}}>
        <span>✓ Exacto = <strong style={{color:"#00C896"}}>3 pts</strong></span>
        <span>~ Resultado = <strong style={{color:DA_YELLOW}}>1 pt</strong></span>
        <span>🏆 Campeón = <strong style={{color:DA_TEAL}}>5 pts</strong></span>
        <span>✗ Error = <strong style={{color:"#E53E3E"}}>0 pts</strong></span>
      </div>
    </div>
  );
}

// ── FASES ELIMINATORIAS (vista usuario) ───────────────────────────────────────
function FasesEliminatorias({usuario, empresa, resultados: resultadosInicial, fasesEquipos, onSave}){
  const key=`da_pred_eli_${usuario}`;
  const [preds,setPreds]=useState(()=>load(key,{}));
  const [saved,setSaved]=useState(false);
  const [resultados,setResultados]=useState(resultadosInicial||{});

  // Recargar resultados frescos desde Firebase al entrar a esta pestaña
  useEffect(()=>{
    (async()=>{
      const r = await fbGet("resultados");
      if(r) setResultados(r);
      else setResultados(resultadosInicial||{});
    })();
  },[]);

  const set=(id,side,val)=>setPreds(p=>({...p,[id]:{...p[id],[side]:val}}));

  const guardar=async()=>{
    save(key,preds);
    const fbKey=(usuario+"__"+(empresa||"")).replace(/[.#$\[\]/]/g,"_");
    await fbUpdate(`predicciones/${fbKey}`, preds);
    onSave();
    setSaved(true); setTimeout(()=>setSaved(false),2500);
  };

  // Para 16avos, los equipos están fijos en FASES_ELIMINATORIAS
  // Para otras fases, vienen de fasesEquipos (cargados por admin)
  const getEquipos=(fase, partido)=>{
    // Si el partido ya tiene equipos hardcodeados, usarlos
    if(partido.local && partido.visitante){
      return {local: partido.local, visitante: partido.visitante};
    }
    // Si no, buscar en fasesEquipos (cargados por admin)
    return fasesEquipos[partido.id] || {};
  };

  const hayAlgunaFase = FASES_ELIMINATORIAS.some(fase =>
    fase.partidos.some(p => {
      if(fase.id==="dieciseisavos") return true;
      const eq = fasesEquipos[p.id] || {};
      return eq.local && eq.visitante;
    })
  );

  if(!hayAlgunaFase) return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"24px 16px",textAlign:"center"}}>
      <div style={{fontSize:40,marginBottom:16}}>⏳</div>
      <div style={{color:DA_TEXT_LIGHT,fontSize:16}}>
        Las fases eliminatorias aún no están disponibles.<br/>
        Volvé cuando terminen los grupos.
      </div>
    </div>
  );

  return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px 90px"}}>
      {FASES_ELIMINATORIAS.map(fase=>{
        const partidosVisibles = fase.partidos;
        return(
          <div key={fase.id} style={{marginBottom:28}}>
            <div style={{display:"flex",alignItems:"center",gap:10,
              marginBottom:12,borderBottom:`2px solid ${DA_YELLOW}33`,paddingBottom:8}}>
              <span style={{background:DA_YELLOW,color:"#111",
                fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
                fontSize:18,padding:"2px 12px",borderRadius:6}}>
                {fase.label.toUpperCase()}
              </span>
            </div>
            {partidosVisibles.map(p=>{
              const eq=getEquipos(fase,p);
              const pred=preds[p.id]||{local:"",visitante:""};
              const real=resultados[p.id];
              const pts=calcPuntos(pred,real);
              const locked=!!(real?.local!==undefined&&real?.local!=="");
              return(
                <div key={p.id} style={{
                  display:"flex",alignItems:"center",gap:8,
                  background:DA_CARD,borderRadius:12,padding:"11px 13px",marginBottom:7,
                  border:pts===3?`1px solid #00C89666`
                    :pts===1?`1px solid ${DA_YELLOW}66`
                    :`1px solid rgba(255,255,255,0.06)`}}>
                  <span style={{flex:1,textAlign:"right",fontSize:13,fontWeight:600,color:"#fff"}}>
                    {FLAGS[eq.local]||"🏳️"} {eq.local||"?"}
                  </span>
                  {locked ? (
                    <>
                      <span style={{width:44,textAlign:"center",fontSize:20,fontWeight:800,
                        background:"rgba(255,255,255,0.06)",
                        border:"2px solid rgba(255,255,255,0.1)",
                        borderRadius:8,color:"rgba(255,255,255,0.5)",
                        padding:"6px 2px",display:"inline-block"}}>
                        {real?.local??"-"}
                      </span>
                      <span style={{color:"rgba(255,255,255,0.2)",fontSize:12}}>—</span>
                      <span style={{width:44,textAlign:"center",fontSize:20,fontWeight:800,
                        background:"rgba(255,255,255,0.06)",
                        border:"2px solid rgba(255,255,255,0.1)",
                        borderRadius:8,color:"rgba(255,255,255,0.5)",
                        padding:"6px 2px",display:"inline-block"}}>
                        {real?.visitante??"-"}
                      </span>
                    </>
                  ) : (
                    <>
                      <input type="number" min="0" max="20" value={pred.local}
                        onChange={e=>set(p.id,"local",e.target.value)}
                        style={{width:44,textAlign:"center",fontSize:20,fontWeight:800,
                          background:"rgba(42,191,191,0.1)",
                          border:`2px solid ${DA_TEAL+"66"}`,
                          borderRadius:8,color:"#fff",
                          padding:"6px 2px",outline:"none"}}/>
                      <span style={{color:"rgba(255,255,255,0.2)",fontSize:12}}>—</span>
                      <input type="number" min="0" max="20" value={pred.visitante}
                        onChange={e=>set(p.id,"visitante",e.target.value)}
                        style={{width:44,textAlign:"center",fontSize:20,fontWeight:800,
                          background:"rgba(42,191,191,0.1)",
                          border:`2px solid ${DA_TEAL+"66"}`,
                          borderRadius:8,color:"#fff",
                          padding:"6px 2px",outline:"none"}}/>
                    </>
                  )}
                  <span style={{flex:1,fontSize:13,fontWeight:600,color:"#fff"}}>
                    {FLAGS[eq.visitante]||"🏳️"} {eq.visitante||"?"}
                  </span>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.25)",minWidth:32,textAlign:"right"}}>
                    {p.fecha}
                  </span>
                  {pts!==null&&(
                    <span style={{background:pts===3?"#00C896":pts===1?DA_YELLOW:"#E53E3E",
                      color:"#111",borderRadius:5,padding:"2px 7px",
                      fontSize:11,fontWeight:700,marginLeft:4}}>
                      {pts===3?"✓ +3":pts===1?"~+1":"✗"}
                    </span>
                  )}
                </div>
              );
            })}
          </div>
        );
      })}

      <div style={{position:"fixed",bottom:20,left:"50%",
        transform:"translateX(-50%)",zIndex:100,
        display:"flex",gap:8,alignItems:"center",
        background:"rgba(26,32,44,0.85)",backdropFilter:"blur(10px)",
        borderRadius:50,padding:"8px 12px",
        border:"1px solid rgba(255,255,255,0.08)"}}>
        <button onClick={guardar}
          style={{background:saved?"#00C896":DA_YELLOW,color:"#111",
            border:"none",borderRadius:50,padding:"10px 26px",
            fontSize:14,fontWeight:800,cursor:"pointer",
            fontFamily:"'Barlow Condensed',sans-serif",
            letterSpacing:2,textTransform:"uppercase",transition:"background .3s"}}>
          {saved?"✓ Listo":"Guardar"}
        </button>
      </div>
    </div>
  );
}

// ── GESTOR DE USUARIOS (admin) ────────────────────────────────────────────────
function GestorUsuarios(){
  const [usuarios,setUsuarios]=useState([]);
  const [loading,setLoading]=useState(true);
  const [borrando,setBorrando]=useState(null);

  const cargar=async()=>{
    setLoading(true);
    const u=await fbGet("usuarios");
    if(u){
      // Guardar la clave de Firebase junto con los datos
      const lista = Object.entries(u).map(([fbKey,datos])=>({...datos,fbKey}));
      setUsuarios(lista);
    } else {
      setUsuarios([]);
    }
    setLoading(false);
  };

  useEffect(()=>{ cargar(); },[]);

  const borrar=async(u)=>{
    if(!confirm(`¿Borrar a ${u.nombre} (${u.empresa})?`)) return;
    const k = u.fbKey || u.key;
    setBorrando(k);
    await fbDelete(`usuarios/${k}`);
    await fbDelete(`predicciones/${k}`);
    await fbDelete(`campeones/${k}`);
    await cargar();
    setBorrando(null);
  };

  return(
    <div style={{background:"rgba(255,255,255,0.03)",border:`1px solid rgba(255,255,255,0.08)`,
      borderRadius:14,padding:"16px 18px",marginBottom:24}}>
      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
        fontSize:16,color:DA_TEXT_LIGHT,letterSpacing:2,textTransform:"uppercase",
        marginBottom:14}}>
        👥 Gestionar participantes
      </div>

      {loading&&<p style={{color:"rgba(255,255,255,0.3)",fontSize:13}}>Cargando...</p>}

      {!loading&&usuarios.length===0&&(
        <p style={{color:"rgba(255,255,255,0.3)",fontSize:13}}>No hay participantes.</p>
      )}

      {!loading&&usuarios.map(u=>(
        <div key={u.fbKey||u.key||u.nombre} style={{
          display:"flex",alignItems:"center",gap:10,
          background:"rgba(255,255,255,0.04)",borderRadius:10,
          padding:"9px 12px",marginBottom:7}}>
          <div style={{flex:1}}>
            <div style={{color:"#fff",fontWeight:600,fontSize:14}}>{u.nombre}</div>
            <div style={{color:DA_TEXT_LIGHT,fontSize:11}}>{u.empresa}
              {u.wp&&<span style={{color:"#25D366",marginLeft:6}}>📱 {u.wp}</span>}
            </div>
          </div>
          <button
            onClick={()=>borrar(u)}
            disabled={borrando===(u.fbKey||u.key)}
            style={{background:"rgba(229,62,62,0.15)",
              border:"1px solid rgba(229,62,62,0.4)",
              color:"#E53E3E",borderRadius:8,padding:"5px 12px",
              cursor:"pointer",fontSize:12,fontWeight:700,
              opacity:borrando===(u.fbKey||u.key)?0.5:1}}>

// ── SINCRONIZADOR AUTOMÁTICO (admin) ──────────────────────────────────────────
function SincronizadorAuto({resultados, onUpdate}){
  const [sincronizando,setSincronizando]=useState(false);
  const [mensaje,setMensaje]=useState("");
  const [ultimaSinc,setUltimaSinc]=useState(()=>load("da_ultima_sinc",""));

  const sincronizar=async()=>{
    setSincronizando(true);
    setMensaje("");
    const apiResultados = await sincronizarResultadosAuto();
    if(!apiResultados){
      setMensaje("⚠️ No se pudo conectar con la API. Intentá de nuevo en un momento.");
      setSincronizando(false);
      return;
    }
    if(apiResultados.length===0){
      setMensaje("ℹ️ Todavía no hay partidos finalizados según la API.");
      setSincronizando(false);
      return;
    }

    // Partidos que el admin corrigió/cargó a mano quedan protegidos para siempre
    const bloqueados = load("da_resultados_manuales", {});

    let actualizados=0, omitidos=0;
    const nuevos={...resultados};
    apiResultados.forEach(m=>{
      if(m.golesLocal===null||m.golesLocal===undefined) return;
      const match = encontrarPartidoId(m.local, m.visitante);
      if(!match) return;
      if(bloqueados[match.id]){ omitidos++; return; } // protegido, no tocar
      const yaEstaba = nuevos[match.id]?.local!==undefined && nuevos[match.id]?.local!=="";
      const gl = match.invertido ? m.golesVisitante : m.golesLocal;
      const gv = match.invertido ? m.golesLocal : m.golesVisitante;
      const valorNuevo = {local:String(gl), visitante:String(gv)};
      const valorViejo = nuevos[match.id];
      const cambio = !yaEstaba || valorViejo?.local!==valorNuevo.local || valorViejo?.visitante!==valorNuevo.visitante;
      if(cambio){
        nuevos[match.id]=valorNuevo;
        actualizados++;
      }
    });

    if(actualizados>0){
      onUpdate(nuevos);
      save("da_resultados",nuevos);
      await fbSet("resultados", nuevos);
      setMensaje(`✅ ${actualizados} resultado(s) actualizado(s)`+(omitidos>0?` · ${omitidos} protegido(s) sin tocar.`:"."));
    } else {
      setMensaje("✓ Ya estaba todo al día, no había cambios."+(omitidos>0?` (${omitidos} protegido(s))`:""));
    }

    const ahora = new Date().toLocaleString("es-UY");
    setUltimaSinc(ahora);
    save("da_ultima_sinc", ahora);
    setSincronizando(false);
  };

  return(
    <div style={{background:`${DA_TEAL}10`,border:`1px solid ${DA_TEAL}33`,
      borderRadius:12,padding:"14px 16px",marginBottom:24}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",
        flexWrap:"wrap",gap:10}}>
        <div>
          <div style={{color:DA_TEAL,fontWeight:700,fontSize:14}}>
            🔄 Sincronización automática
          </div>
          {ultimaSinc&&(
            <div style={{color:"rgba(255,255,255,0.3)",fontSize:11,marginTop:2}}>
              Última vez: {ultimaSinc}
            </div>
          )}
        </div>
        <button onClick={sincronizar} disabled={sincronizando}
          style={{background:sincronizando?"rgba(255,255,255,0.1)":DA_TEAL,
            color:sincronizando?"rgba(255,255,255,0.4)":"#111",
            border:"none",borderRadius:8,padding:"8px 18px",
            cursor:sincronizando?"default":"pointer",fontSize:13,fontWeight:700}}>
          {sincronizando?"Sincronizando...":"Sincronizar ahora"}
        </button>
      </div>
      {mensaje&&(
        <div style={{marginTop:10,fontSize:12,color:"rgba(255,255,255,0.6)"}}>
          {mensaje}
        </div>
      )}
    </div>
  );
}

function Admin({resultados,campeonReal,onUpdate,onCampeon}){
  const [local,setLocal]=useState({});
  const [campeonInput,setCampeonInput]=useState(campeonReal||"");
  // Al cambiar un campo, partir siempre de lo ya guardado (resultados) + lo editado en esta sesión (local)
  const setScore=(id,side,val)=>setLocal(p=>({
    ...p,
    [id]:{
      local: p[id]?.local !== undefined ? p[id].local : (resultados[id]?.local ?? ""),
      visitante: p[id]?.visitante !== undefined ? p[id].visitante : (resultados[id]?.visitante ?? ""),
      [side]: val,
    }
  }));

  const guardar=async()=>{
    const merged={...resultados,...local};
    onUpdate(merged);
    save("da_resultados",merged);
    await fbSet("resultados", merged);
    // Marcar como "manual" cada partido que se tocó en esta edición,
    // para que la sincronización automática nunca lo sobreescriba
    const bloqueados = load("da_resultados_manuales", {});
    Object.keys(local).forEach(id=>{ bloqueados[id]=true; });
    save("da_resultados_manuales", bloqueados);
    if(campeonInput){
      onCampeon(campeonInput);
      save("da_campeon_real",campeonInput);
      await fbSet("campeon_real", campeonInput);
    }
    setLocal({});
    alert("✅ Guardado");
  };

  return(
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 16px 80px"}}>

        <select value={campeonInput} onChange={e=>setCampeonInput(e.target.value)}

            border:`2px solid ${DA_YELLOW}55`,borderRadius:10,

        </p>
      )}

      {seleccionado&&usuario&&(
        <>
          {/* Campeón elegido */}
          <div style={{background:`${DA_YELLOW}12`,border:`1px solid ${DA_YELLOW}33`,
            borderRadius:12,padding:"12px 16px",marginBottom:20,
            display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:20}}>🏆</span>
            <div>
              <div style={{color:DA_TEXT_LIGHT,fontSize:11,textTransform:"uppercase",letterSpacing:1}}>
                Campeón elegido por {usuario.nombre}
              </div>
              <div style={{color:"#fff",fontWeight:700,fontSize:16,marginTop:2}}>
                {campeon ? `${FLAGS[campeon]||""} ${campeon}` : "No eligió campeón"}
              </div>
            </div>
          </div>

          {/* Partidos de grupos */}
          {GRUPOS.map(g=>{
            const tieneAlguna = g.partidos.some(p=>preds[p.id]?.local!=="");
            if(!tieneAlguna) return null;
            return(
              <div key={g.id} style={{marginBottom:24}}>
                <div style={{display:"flex",alignItems:"center",gap:10,
                  marginBottom:10,borderBottom:`2px solid ${DA_YELLOW}33`,paddingBottom:6}}>
                  <span style={{background:DA_YELLOW,color:"#111",
                    fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
                    fontSize:17,padding:"2px 10px",borderRadius:6}}>
                    GRUPO {g.id}
                  </span>
                </div>
                {g.partidos.map(p=>{
                  const pred=preds[p.id]||{local:"",visitante:""};
                  if(pred.local===""&&pred.visitante==="") return null;
                  const real=resultados[p.id];
                  const pts=calcPuntos(pred,real);
                  return(
                    <div key={p.id} style={{
                      display:"flex",alignItems:"center",gap:8,
                      background:DA_CARD,borderRadius:10,padding:"10px 13px",marginBottom:6,
                      border:pts===3?`1px solid #00C89666`
                        :pts===1?`1px solid ${DA_YELLOW}66`
                        :`1px solid rgba(255,255,255,0.06)`}}>
                      <span style={{flex:1,textAlign:"right",fontSize:13,fontWeight:600,color:"#fff"}}>
                        {FLAGS[p.local]||""} {p.local}
                      </span>
                      <span style={{
                        background:"rgba(255,255,255,0.08)",borderRadius:8,
                        padding:"6px 14px",fontSize:18,fontWeight:800,color:"#fff",
                        minWidth:60,textAlign:"center"}}>
                        {pred.local!==undefined&&pred.local!==""?pred.local:"?"} — {pred.visitante!==undefined&&pred.visitante!==""?pred.visitante:"?"}
                      </span>
                      <span style={{flex:1,fontSize:13,fontWeight:600,color:"#fff"}}>
                        {FLAGS[p.visitante]||""} {p.visitante}
                      </span>
                      {pts!==null&&(
                        <span style={{background:pts===3?"#00C896":pts===1?DA_YELLOW:"#E53E3E",
                          color:"#111",borderRadius:5,padding:"2px 7px",
                          fontSize:11,fontWeight:700}}>
                          {pts===3?"✓ +3":pts===1?"~+1":"✗"}
                        </span>
                      )}
                    </div>
                  );
                })}
              </div>
            );
          })}

          {/* 16avos de final */}
          {FASES_ELIMINATORIAS[0].partidos.some(p=>preds[p.id]?.local!==undefined&&preds[p.id]?.local!=="")&&(
            <div style={{marginBottom:24}}>
              <div style={{display:"flex",alignItems:"center",gap:10,
                marginBottom:10,borderBottom:`2px solid ${DA_TEAL}33`,paddingBottom:6}}>
                <span style={{background:DA_TEAL,color:"#111",
                  fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,
                  fontSize:17,padding:"2px 10px",borderRadius:6}}>
                  16AVOS DE FINAL
                </span>
              </div>
              {FASES_ELIMINATORIAS[0].partidos.map(p=>{
                const pred=preds[p.id]||{local:"",visitante:""};
                if(pred.local===""&&pred.visitante==="") return null;
                const real=resultados[p.id];
                const pts=calcPuntos(pred,real);
                return(
                  <div key={p.id} style={{
                    display:"flex",alignItems:"center",gap:8,
                    background:DA_CARD,borderRadius:10,padding:"10px 13px",marginBottom:6,
                    border:pts===3?`1px solid #00C89666`
                      :pts===1?`1px solid ${DA_YELLOW}66`
                      :`1px solid rgba(255,255,255,0.06)`}}>
                    <span style={{flex:1,textAlign:"right",fontSize:13,fontWeight:600,color:"#fff"}}>
                      {FLAGS[p.local]||""} {p.local}
                    </span>
                    <span style={{
                      background:"rgba(255,255,255,0.08)",borderRadius:8,
                      padding:"6px 14px",fontSize:18,fontWeight:800,color:"#fff",
                      minWidth:60,textAlign:"center"}}>
                      {pred.local!==""?pred.local:"?"} — {pred.visitante!==""?pred.visitante:"?"}
                    </span>
                    <span style={{flex:1,fontSize:13,fontWeight:600,color:"#fff"}}>
                      {FLAGS[p.visitante]||""} {p.visitante}
                    </span>
                    {pts!==null&&(
                      <span style={{background:pts===3?"#00C896":pts===1?DA_YELLOW:"#E53E3E",
                        color:"#111",borderRadius:5,padding:"2px 7px",
                        fontSize:11,fontWeight:700}}>
                        {pts===3?"✓ +3":pts===1?"~+1":"✗"}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
    </div>
  );
}




    ReactDOM.createRoot(document.getElementById("root")).render(<PencaApp />);
  </script>
</body>
</html>
